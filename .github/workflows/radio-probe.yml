name: Probe radio stream sources
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/radio-probe.yml'
      - '.github/scripts/radio_probe.py'
      - '.github/scripts/probe_candidates.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/radio_probe.py
