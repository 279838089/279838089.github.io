name: Kindle dashboard
on:
  workflow_dispatch:
  push:
    branches: [master]
  schedule:
    - cron: '17 1,4,7,10,13,16,19,22 * * *'
    # Backup trigger 30 minutes later if GitHub drops the first scheduled run.
    - cron: '47 1,4,7,10,13,16,19,22 * * *'
permissions:
  contents: write
concurrency:
  group: kindle-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install -r requirements.txt
      - name: Get sprite assets
        run: python fetch_sprites.py
      - name: Vendor sprite assets once
        run: |
          # First run fetches the three tiny original PNGs, commits them to the
          # repository, and all following runs load them without network calls.
          if test -s assets/normal.png && test -s assets/mega_x.png && test -s assets/mega_y.png; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f assets/normal.png assets/mega_x.png assets/mega_y.png
            if ! git diff --cached --quiet; then
              git commit -m "Bundle Charizard sprite PNGs for reliable Kindle builds"
              git push origin HEAD:master || echo "::warning::Could not push sprites; will retry on the next workflow run"
            else
              echo "All three sprite assets are already checked into Git"
            fi
          else
            echo "::warning::One or more sprites are unavailable; will retry on the next run"
          fi
      - name: Render image
        env:
          CITY: '深圳'
          LATITUDE: '22.5431'
          LONGITUDE: '114.0579'
          OUTPUT_MODE: '1'
        run: python render.py
      - name: Verify PNG and write build summary
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from PIL import Image
          from pathlib import Path
          status = json.loads(Path('site/status.json').read_text(encoding='utf-8'))
          with Image.open('site/screen.png') as picture:
              picture.verify()
          with Image.open('site/screen.png') as picture:
              assert picture.size == (600, 800), picture.size
          now = datetime.now(ZoneInfo('Asia/Shanghai'))
          generated = datetime.fromisoformat(status['generated_at'])
          age = abs((now - generated).total_seconds())
          assert age < 1200, f'Stale build timestamp: {status["generated_at"]}'
          expected = ('normal' if 6 <= generated.hour < 12 else
                      'mega_x' if 12 <= generated.hour < 18 else 'mega_y')
          assert status['form'] == expected, (status['form'], expected)
          print('Generated:', status['generated_at'], 'Form:', status['form'])
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('### Kindle dashboard build\n')
              out.write('- Beijing time: '+status['generated_at']+'\n')
              out.write('- Sprite: '+status['form']+'\n')
              out.write('- PNG: 600 x 800\n')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
